name: publish

on:
  schedule:
    # 07:12 ET. Jittered off the hour so it is not queued behind every
    # other cron on GitHub's scheduler. UTC, so this drifts an hour with DST.
    - cron: "12 11 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build containers but do not publish"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish next carousel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/publish.py

      - name: Commit queue state
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet queue.json; then
            echo "queue unchanged"
            exit 0
          fi
          git config user.name  "of-daily bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue.json
          git commit -m "published: $(date -u +%Y-%m-%d)"
          git push
